## 2. Core State Management & Data Schema

### Directed Acyclic Graph (DAG) for Thought Trails
Hush represents dialogues as non-linear immutable nodes rather than a flat message array.

```typescript
// types/hush.ts

export type ConversationStyle = 
  | 'quick-fix'       // Concise, immediate response
  | 'explain-it'      // Dialectic & foundational explanation
  | 'think-with-me'   // Collaborative thinking & exploration
  | 'challenge-me';   // Rigorous critique & counter-arguments

export interface ThoughtNode {
  id: string;                    // e.g. "node-01" or crypto hash
  section: string;               // e.g. "§ 01.1"
  parentId: string | null;       // null for root question
  author: 'user' | 'assistant';
  content: string;
  timestamp: number;
  metadata?: {
    model?: string;              // "llama3.2:3b"
    tokensPerSecond?: number;    // 48.2
    firstTokenMs?: number;       // 284
    branchLabel?: string;        // "Branch #02 · Zero-Trace Purge"
    codeLanguage?: string;
  };
}

export interface ThoughtTrail {
  id: string;
  title: string;
  anchorNodeId: string;         // The parent node from which this branch sprouted
  anchorTurn: string;           // e.g. "Turn 1, § 01.3"
  activeNodeId: string;
  nodeIds: string[];
  turnsCount: number;
  cachedMemoryBytes: number;
}

export interface OllamaRuntimeState {
  status: 'ready' | 'connecting' | 'unavailable' | 'generating';
  model: string;
  endpoint: string;             // default: "http://localhost:11434"
  tokensPerSec: number;
  vramUsageGb: number;
  vramTotalGb: number;
  networkEgressKb: number;      // 0.0 KB (Airgapped invariant)
  isRamIsolated: boolean;
}
```

## 4. Key React Component Implementations

### A. Contextual Composer (`components/composer/FloatingComposer.tsx`)

```tsx
'use client';

import React, { useState, useRef, useEffect } from 'react';
import { ArrowUp, Paperclip, Sparkles, X } from 'lucide-react';
import { ConversationStyle } from '@/types/hush';

interface FloatingComposerProps {
  activeBranchAnchor?: { id: string; section: string } | null;
  onClearBranch: () => void;
  onSubmit: (prompt: string, style: ConversationStyle) => void;
  isStreaming?: boolean;
}

export const FloatingComposer: React.FC<FloatingComposerProps> = ({
  activeBranchAnchor,
  onClearBranch,
  onSubmit,
  isStreaming = false,
}) => {
  const [prompt, setPrompt] = useState('');
  const [style, setStyle] = useState<ConversationStyle>('think-with-me');
  const textareaRef = useRef<HTMLTextAreaElement>(null);

  const handleKeyDown = (e: React.KeyboardEvent<HTMLTextAreaElement>) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      if (prompt.trim() && !isStreaming) {
        onSubmit(prompt.trim(), style);
        setPrompt('');
      }
    }
  };

  return (
    <div className="w-full max-w-3xl mx-auto px-4">
      {/* Branching Anchor Notification if user is forking */}
      {activeBranchAnchor && (
        <div className="flex items-center justify-between px-3 py-1.5 mb-2 bg-[#1b1b22] border border-[#343044] rounded-lg text-xs text-[#C4B5FD]">
          <span className="flex items-center gap-1.5 font-mono">
            <span className="w-2 h-2 rounded-full bg-[#9D8BFF] animate-pulse" />
            Branching from {activeBranchAnchor.section}
          </span>
          <button 
            onClick={onClearBranch}
            className="flex items-center gap-1 text-[#777187] hover:text-[#F3F0FA] transition-colors"
          >
            <span>Cancel fork</span>
            <X size={12} />
          </button>
        </div>
      )}

      {/* Main Composer Box */}
      <div className="relative bg-[#12121B] border border-[#343044] focus-within:border-[#9D8BFF] rounded-2xl shadow-composer transition-all duration-200 p-3.5">
        <textarea
          ref={textareaRef}
          value={prompt}
          onChange={(e) => setPrompt(e.target.value)}
          onKeyDown={handleKeyDown}
          rows={3}
          placeholder="Whisper a hypothesis, sketch an inquiry, or let a thought unfurl..."
          className="w-full bg-transparent text-[#F3F0FA] placeholder-[#777187] text-sm md:text-base resize-none focus:outline-none font-sans"
        />

        <div className="flex flex-wrap items-center justify-between gap-2 pt-2 border-t border-[#181722]">
          {/* Cognitive Styles Selector */}
          <div className="flex items-center gap-1.5 overflow-x-auto py-1">
            {[
              { id: 'quick-fix', label: 'Quick Fix' },
              { id: 'explain-it', label: 'Explain It' },
              { id: 'think-with-me', label: 'Think With Me' },
              { id: 'challenge-me', label: 'Challenge Me' },
            ].map((mode) => (
              <button
                key={mode.id}
                type="button"
                onClick={() => setStyle(mode.id as ConversationStyle)}
                className={`px-2.5 py-1 rounded-full text-xs font-medium transition-all ${
                  style === mode.id
                    ? 'bg-[#9D8BFF]/20 text-[#C4B5FD] border border-[#9D8BFF]/40 shadow-sm'
                    : 'bg-[#181722] text-[#A9A4BB] hover:text-[#F3F0FA] border border-transparent'
                }`}
              >
                {mode.label}
              </button>
            ))}
          </div>

          {/* Action Cues & Send Button */}
          <div className="flex items-center gap-3">
            <span className="hidden sm:inline text-[11px] font-mono text-[#777187]">
              Enter ↵ to send
            </span>
            <button
              onClick={() => {
                if (prompt.trim() && !isStreaming) {
                  onSubmit(prompt.trim(), style);
                  setPrompt('');
                }
              }}
              disabled={!prompt.trim() || isStreaming}
              aria-label="Send query"
              className="p-2.5 bg-[#9D8BFF] text-[#0B0B12] rounded-xl hover:bg-[#C4B5FD] disabled:opacity-40 disabled:hover:bg-[#9D8BFF] transition-all flex items-center justify-center font-bold"
            >
              <ArrowUp size={16} strokeWidth={2.5} />
            </button>
          </div>
        </div>
      </div>
    </div>
  );
};
```

### C. Local Ollama Client Bridge (Airgapped API Route)

```typescript
// app/api/chat/route.ts
// Handles streaming responses directly from the local Ollama instance without telemetry

export const runtime = 'nodejs';

export async function POST(req: Request) {
  const { prompt, style, history } = await req.json();

  const systemPrompts: Record<string, string> = {
    'quick-fix': 'You are Hush. Provide direct, concise, high-signal answers with zero preamble.',
    'explain-it': 'You are Hush. Explain concepts from first principles with clear, approachable prose.',
    'think-with-me': 'You are Hush. Be an intellectual collaborator. Explore tradeoffs, questions, and ideas together.',
    'challenge-me': 'You are Hush. Act as a rigorous dialectic counterweight. Interrogate assumptions and offer counterarguments.',
  };

  const ollamaEndpoint = process.env.OLLAMA_HOST || 'http://127.0.0.1:11434';
  const model = process.env.OLLAMA_MODEL || 'llama3.2:3b';

  try {
    const response = await fetch(`${ollamaEndpoint}/api/generate`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model,
        prompt,
        system: systemPrompts[style] || systemPrompts['think-with-me'],
        stream: true,
      }),
    });

    if (!response.ok) {
      return new Response(JSON.stringify({ error: 'Local Ollama runtime unreachable' }), {
        status: 503,
      });
    }

    // Forward the ReadableStream to client
    return new Response(response.body, {
      headers: {
        'Content-Type': 'text/event-stream',
        'Cache-Control': 'no-cache',
        'Connection': 'keep-alive',
      },
    });
  } catch (error) {
    return new Response(JSON.stringify({ error: 'Failed to connect to local Ollama daemon' }), {
      status: 500,
    });
  }
}
